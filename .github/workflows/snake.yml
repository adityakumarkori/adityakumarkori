name: Generate contribution snake

on:
  schedule:
    - cron: "30 2 * * 0"  # Weekly Sunday 8:00 AM IST (2:30 AM UTC)
    - cron: "13 19 1 9 *"  # Temporary: today Sep 01 19:13 UTC (Sep 02 00:43 IST) ~10 min from now — one-time, remove after verification
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: adityakumarkori
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
